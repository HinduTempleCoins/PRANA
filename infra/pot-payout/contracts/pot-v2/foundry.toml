[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "london"   # PRANA is a PoW core-geth chain (no PUSH0 / Shanghai)
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"    # reproducible runtime bytecode for on-chain verification
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
